name: Build and deploy Prague website

# The site ships with the library: a stable release (not a prerelease) rebuilds and deploys it from
# the released tag, so the published docs describe the published package. A push to main does not
# deploy; use "Run workflow" for an out-of-band docs fix. The github-pages environment allows the
# refs `main`, `www/*` and tags `v*`, so a release-triggered deploy passes its branch policy.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site + docs
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    steps:
      # A release event runs on the tag ref, so the site is built from exactly the released commit.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: www/site/package-lock.json

      # Every project multi-targets net9.0;net10.0;net11.0, and DocFX compiles them
      # to extract the API reference, so all three SDKs are needed.
      - name: Setup .NET 9 + 10 + 11
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x
            11.0.x

      - name: Restore .NET solution
        run: dotnet restore Prague.Publish.slnf

      - name: Install DocFX
        run: dotnet tool update -g docfx

      # Same source of truth as release.yml: the newest stable (non-draft, non-prerelease)
      # GitHub release. <Version> in Directory.Build.props is only the bootstrap fallback.
      - name: Read library version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v=$(gh release list --limit 200 --json tagName,isPrerelease,isDraft \
              | jq -r '.[] | select(.isDraft == false and .isPrerelease == false) | .tagName' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -n1 || true)
          if [[ -z "$v" ]]; then
            v=$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' Directory.Build.props | head -1)
            echo "No stable release found; falling back to Directory.Build.props"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Prague version: $v"

      - name: Build landing (Vite, prerendered to static HTML)
        working-directory: www/site
        run: |
          npm ci
          npm run build

      # The release-notes page is generated from GitHub Releases on every build and never committed
      # (www/.gitignore); without it the toc.yml entry is a dead link and DocFX warns InvalidFileLink.
      - name: Generate release notes page
        env:
          GH_TOKEN: ${{ github.token }}
        run: www/docs/scripts/release-notes.sh

      - name: Build docs (DocFX)
        working-directory: www/docs
        run: docfx docfx.json --metadata _pragueVersion=${{ steps.version.outputs.version }}

      # Excalidraw's SVG export names Excalifont but does not embed it; inline it so the
      # diagrams render with the handwriting font instead of a system cursive fallback.
      - name: Embed diagram font
        run: python3 www/docs/scripts/embed-svg-fonts.py www/docs/_site/images

      - name: Assemble _site
        run: |
          mkdir -p _site/docs
          cp -R www/site/dist/. _site/
          cp -R www/docs/_site/. _site/docs/
          cp docs/llm-readme.txt _site/llms-full.txt
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/docs/index.html
          test -f _site/docs/api/index.html
          test -f _site/docs/articles/reference/release-notes.html   # generated page made it in
          test -f _site/docs/articles/reference/benchmarks.html
          grep -q 'Fast as' _site/index.html   # prerender actually ran
          grep -q "Prague v${{ steps.version.outputs.version }}" _site/docs/index.html   # version pill rendered

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
